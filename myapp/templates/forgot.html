{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Forgot Password | Ogani Fruits</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      rel="stylesheet"
      href="{% static 'css/bootstrap.min.css' %}"
      type="text/css"
    />
    <link
      rel="stylesheet"
      href="{% static 'css/style.css' %}"
      type="text/css"
    />

    <style>
      .auth-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f5f5;
      }
      .auth-card {
        background: #ffffff;
        border-radius: 1rem;
        box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.08);
        padding: 2.5rem;
        max-width: 420px;
        width: 100%;
      }
      .auth-title {
        color: #7fad39;
        font-weight: 700;
      }
      .btn-ogani {
        background: #7fad39;
        border-color: #7fad39;
      }
      .btn-ogani:hover {
        background: #6e9933;
        border-color: #6e9933;
      }
    </style>
  </head>

  <body>
    <div class="auth-container">
      <div class="auth-card">
        <h3 class="auth-title mb-4 text-center">Forgot Password</h3>

        {% if message %}
        <div class="alert alert-success">{{ message }}</div>
        {% endif %} {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="post">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input
              type="email"
              name="email"
              class="form-control"
              value="{{ request.session.reset_email }}"
              required
            />
          </div>

          {% if otp_sent %}
          <div class="mb-3">
            <label class="form-label">Enter OTP</label>
            <input type="text" name="otp" class="form-control" />
          </div>

          <div class="mb-3">
            <label class="form-label">New Password</label>
            <input
              type="password"
              name="new_password"
              class="form-control"
            />
          </div>

          <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input
              type="password"
              name="confirm_password"
              class="form-control"
            />
          </div>

          <button type="submit" name="verify_otp" class="btn btn-ogani w-100">
            Reset Password
          </button>

          {% else %}
          <button type="submit" name="send_otp" class="btn btn-ogani w-100">
            Send OTP
          </button>
          {% endif %}
        </form>

        <div class="text-center mt-3">
          <a href="{% url 'login' %}">Back to Login</a>
        </div>
      </div>
    </div>

    <script src="{% static 'js/jquery-3.3.1.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
  </body>
</html>
